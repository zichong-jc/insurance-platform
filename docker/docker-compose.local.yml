
version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: insurance-postgres-local
    environment:
      POSTGRES_DB: insurance_local
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - insurance-network-local

  redis:
    image: redis:7-alpine
    container_name: insurance-redis-local
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis-data-local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - insurance-network-local

  minio:
    image: minio/minio:latest
    container_name: insurance-minio-local
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data-local:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - insurance-network-local

volumes:
  postgres-data-local:
  redis-data-local:
  minio-data-local:

networks:
  insurance-network-local:
    driver: bridge