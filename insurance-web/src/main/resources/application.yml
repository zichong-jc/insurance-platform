
server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5432/insurance_local
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: password
      timeout: 6000ms

# MinIO Configuration
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password
  bucket: insurance

# AI Configuration
ai:
  provider: openai
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  embedding-model: text-embedding-3-small
  temperature: 0.7
  max-tokens: 4096
  memory:
    max-messages: 20
    ttl-minutes: 60

# Sync Configuration
sync:
  enabled: true
  cron: "0 0 2 * * ?"
  timeout-minutes: 30
  retry-count: 3
  retry-delay-seconds: 60

# Parser Configuration
parser:
  max-file-size-mb: 50
  max-pages: 500
  enable-ai-parse: true
  enable-summary: true

# Logging Configuration
logging:
  level:
    com.example.insurance: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  path: ./logs

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true